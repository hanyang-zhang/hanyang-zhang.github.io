<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="960" height="720" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24352a" flood-opacity=".16"/>
  </filter>
  <clipPath id="win"><rect x="16" y="38" width="448" height="286" rx="10"/></clipPath>
  <clipPath id="stage"><rect x="134" y="72" width="224" height="232"/></clipPath>
</defs>
<rect width="480" height="360" fill="#eef1e6"/>

<g filter="url(#soft)"><rect x="16" y="38" width="448" height="286" rx="10" fill="#ffffff"/></g>
